    /* HEADER */
    .page-header {

    .page-label {

      margin-bottom: 12px; display: block;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 500; line-height: 1.2;
      margin-bottom: 12px;
    }

    .page-title em { font-style: italic; color: var(--pink-deep); }

    .page-sub {

    /* REELS GRID */
    .reels-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .reels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media (max-width: 768px) {
      .reels-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }

    @media (max-width: 480px) {
      .reels-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    }

    .reel-card {
      border-radius: 20px; overflow: hidden;
      background: white; border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(224,104,120,0.08);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .reel-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(224,104,120,0.15);
    }

    .reel-video-wrap {
      position: relative;
      aspect-ratio: 9/16;
      background: linear-gradient(135deg, var(--pink-light), #fce0e4);
      overflow: hidden;
    }

    .reel-video-wrap iframe {
      width: 100%; height: 100%;
      border: none; display: block;
    }

    .reel-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
    }

    .reel-placeholder-icon { font-size: 48px; }
    .reel-placeholder-text { font-size: 13px; color: var(--pink-dark); font-weight: 500; }

    .reel-play-btn {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(255,255,255,0.9);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transition: transform 0.2s, background 0.2s;
    }

    .reel-card:hover .reel-play-btn {
      transform: translate(-50%, -50%) scale(1.1);
      background: white;
    }

    .reel-info {
      padding: 16px;
    }

    .reel-title {
      font-size: 14px; font-weight: 500; color: var(--text);
      margin-bottom: 4px;
    }

    .reel-meta {
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }

    /* Instagram CTA */
    .instagram-cta {
      text-align: center;
      padding: 48px 24px;
      border-top: 1px solid var(--border);
      margin-top: 16px;
    }

    .instagram-cta p {

    }

    .btn-primary {
      background: linear-gradient(135deg, var(--pink-deep), var(--pink-dark));
      color: white; border: none; border-radius: 50px;
      padding: 16px 36px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      cursor: pointer; text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 24px rgba(224,104,120,0.35);
      display: inline-flex; align-items: center; gap: 8px;
    }

    .btn-primary:hover { transform: translateY(-2px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reel-card { animation: fadeUp 0.5s ease both; }
    .reel-card:nth-child(2) { animation-delay: 0.1s; }
    .reel-card:nth-child(3) { animation-delay: 0.2s; }
    .reel-card:nth-child(4) { animation-delay: 0.3s; }
    .reel-card:nth-child(5) { animation-delay: 0.4s; }
    .reel-card:nth-child(6) { animation-delay: 0.5s; }
